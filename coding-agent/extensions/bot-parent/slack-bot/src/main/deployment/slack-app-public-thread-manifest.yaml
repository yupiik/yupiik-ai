# Optional additive public-thread sample, not an automatic app update or replacement.
# Merge only the channels:history bot-scope addition into the operator-owned manifest.
# Preserve existing settings/events/interactivity; no history event subscription needed.
# Reinstall only if needed, then qualify public conversations.replies with the existing
# bot token before enabling slack.context.thread. Unsupported tokens have no fallback.
# Do not add user tokens/scopes, private/DM scopes, users:read or search scopes for this.
# The xapp token's separate connections:write scope remains unchanged.
display_information:
  name: YCA Slack assistant
features:
  bot_user:
    display_name: YCA
    always_online: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:history
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
